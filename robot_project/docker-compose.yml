services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: restaurant
      POSTGRES_USER: restaurant
      POSTGRES_PASSWORD: restaurant_dev_only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U restaurant -d restaurant"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - restaurant-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    env_file:
      - path: backend/.env.example
        required: true
      - path: backend/.env
        required: false
    environment:
      DATABASE_URL: postgresql+asyncpg://restaurant:restaurant_dev_only@postgres:5432/restaurant
      APP_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - restaurant-web-uploads:/app/web/assets/uploads
    command: >-
      sh -c "alembic upgrade head && python -m app.seed &&
      uvicorn app.main:app --host 0.0.0.0 --port 8000"

volumes:
  restaurant-postgres:
  restaurant-web-uploads:
