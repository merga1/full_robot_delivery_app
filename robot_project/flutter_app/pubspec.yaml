name: robot_controller
description: Autonomous Delivery Robot — tablet control app (SRS v2.0)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  web_socket_channel: ^3.0.1
  shared_preferences: ^2.3.4
  multicast_dns: ^0.3.2
  dartssh2: ^2.11.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/images/robot_controller_logo.png
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/images/robot_controller_logo.png
  web:
    generate: false

flutter:
  uses-material-design: true

  assets:
    - assets/images/robot_controller_logo.png
