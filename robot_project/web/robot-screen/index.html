<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Robot delivery screen</title><link rel="stylesheet" href="/shared/styles.css"><style>body{background:#101827;color:#f8fafc}main{max-width:760px}.card{background:#172338;color:#f8fafc;border-color:#33435e}.muted{color:#a8b6cf}.big{font-size:clamp(2rem,8vw,5rem);font-weight:800;text-align:center;margin:20px 0}.screen-actions{display:grid;grid-template-columns:1fr 1fr;gap:14px}.screen-actions button{min-height:72px;font-size:1.1rem}</style></head>
<body><header><h1>Delivery robot</h1><span id="connection" class="status">Connecting…</span></header><main><section id="setup" class="card"><h2>Robot screen setup</h2><p class="muted">Set the robot id and dedicated screen token once on this device.</p><div class="toolbar"><input id="robot" placeholder="robot_01"><input id="screen-token" type="password" placeholder="Robot screen token"><button id="save">Save</button></div><p id="setup-error"></p></section><section id="mission-card" class="card hidden"><div id="idle" class="big">Ready</div><div id="mission" class="hidden"><div class="big" id="arrival">Delivery in progress</div><h2 id="order"></h2><p id="destination" class="muted"></p><p id="state"></p><div class="screen-actions"><button id="collected">Confirm order collected</button><button class="secondary" id="assist">Request assistance</button></div></div></section></main><script src="/shared/api.js"></script><script src="app.js"></script></body></html>
